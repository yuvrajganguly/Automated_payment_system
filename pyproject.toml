[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payout-system"
version = "0.1.0"
description = "Automated rider payout, EV-rent, dues and COD-hold management for multi-company gig fleets."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Yuvraj Ganguly" }]
keywords = ["fintech", "payments", "automation", "fastapi", "postgresql"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "bcrypt>=4.0",
    "pdfplumber>=0.10",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.7",
    "pydantic>=2.0",
    "psycopg[binary]>=3.1",
]
# Rider documents in an S3-compatible bucket (Cloudflare R2 / AWS S3). Not
# needed for the default local-disk store.
docs = [
    "boto3>=1.34",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
payout-admin = "payout.cli.admin:main"
payout-manage = "payout.cli.manage:main"
payout-api = "payout.cli.serve:main"

[tool.hatch.build.targets.wheel]
packages = ["src/payout"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008 flags `Depends()` / `File()` / `Form()` defaults — that IS the FastAPI idiom.
"src/payout/api/**" = ["B008"]

# Formatting is `ruff format` (black-compatible); black itself is no longer used.

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage floor is a ratchet: raise it as tests are added, never lower it.
addopts = "-ra -q --cov=payout --cov-report=term-missing --cov-fail-under=55"
pythonpath = ["src"]
