# Production stack: Caddy (auto-HTTPS) -> app -> Postgres, plus nightly backups.
#
#   cd deploy
#   cp .env.prod.example .env   # then fill it in
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Nothing but Caddy (80/443) is exposed to the internet. Postgres has no host
# port at all in production — the backup sidecar and the app reach it on the
# internal network; migrations come in via `docker compose exec`.

name: payout-prod

services:
  db:
    image: postgres:16-alpine
    container_name: payout-db
    environment:
      POSTGRES_USER: payout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: payout
    volumes:
      - payout_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payout -d payout"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    # Runs the image CI published to GHCR (see .github/workflows/ci.yml) —
    # `docker compose pull` then `up -d`. The build: line is only a fallback
    # for `up -d --build` on a box with 2 GB+ RAM; a 1 GB Micro must pull.
    image: ghcr.io/yuvrajganguly/automated_payment_system:${PAYOUT_IMAGE_TAG:-latest}
    build: ..
    pull_policy: missing
    container_name: payout
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"                               # internal only; Caddy proxies
    environment:
      - PAYOUT_DB_URL=postgresql://payout:${POSTGRES_PASSWORD}@db:5432/payout
      - PAYOUT_JWT_SECRET=${PAYOUT_JWT_SECRET:?set in deploy/.env}
      - PAYOUT_SEED_DEMO=0                   # real deployment: no demo login/data
      - PAYOUT_COOKIE_SECURE=true            # HTTPS-only cookies behind Caddy
      # Rider documents (KYC uploads from the recruiter app). Default: the
      # payout_docs volume below, copied by the backup sidecar. To use an
      # S3-compatible bucket instead (Cloudflare R2's free tier is enough),
      # set the four PAYOUT_DOCS_S3_* values in deploy/.env — the volume is
      # then unused.
      - PAYOUT_DOCS_DIR=/data/documents
      - PAYOUT_DOCS_S3_BUCKET=${PAYOUT_DOCS_S3_BUCKET:-}
      - PAYOUT_DOCS_S3_ENDPOINT=${PAYOUT_DOCS_S3_ENDPOINT:-}
      - PAYOUT_DOCS_S3_KEY=${PAYOUT_DOCS_S3_KEY:-}
      - PAYOUT_DOCS_S3_SECRET=${PAYOUT_DOCS_S3_SECRET:-}
      # The Android recruiter app calls the API from its own origin.
      - PAYOUT_CORS_ORIGINS=${PAYOUT_CORS_ORIGINS:-}
      # Password-reset emails. Leave unset and "Forgot password" tells the
      # user to ask an administrator (creator: Users page → Set password).
      # Gmail: host smtp.gmail.com, port 587, user = the Gmail address,
      # pass = a 16-character App Password (Google account → Security →
      # 2-Step Verification → App passwords), from = same address.
      - PAYOUT_SMTP_HOST=${PAYOUT_SMTP_HOST:-}
      - PAYOUT_SMTP_PORT=${PAYOUT_SMTP_PORT:-587}
      - PAYOUT_SMTP_USER=${PAYOUT_SMTP_USER:-}
      - PAYOUT_SMTP_PASS=${PAYOUT_SMTP_PASS:-}
      - PAYOUT_SMTP_FROM=${PAYOUT_SMTP_FROM:-}
    volumes:
      - payout_docs:/data/documents
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Public DEMO copy for recruiters / visitors — same image, its own SQLite
  # database on a tmpfs (fake riders re-seeded on every restart), no link to
  # the real Postgres at all. Enabled with COMPOSE_PROFILES=demo and
  # DEMO_ADDRESS=<hostname> in deploy/.env; the login page shows "Explore the
  # live demo" (admin@demo.com / Demo-1234) and the header a DEMO ribbon.
  # Reset it any time with `docker restart payout-demo` (cron does it weekly).
  demo:
    image: ghcr.io/yuvrajganguly/automated_payment_system:${PAYOUT_IMAGE_TAG:-latest}
    container_name: payout-demo
    profiles: ["demo"]
    environment:
      - PAYOUT_DB=/data/demo.db
      - PAYOUT_SEED_DEMO=1
      - PAYOUT_JWT_SECRET=${PAYOUT_DEMO_JWT_SECRET:-${PAYOUT_JWT_SECRET}-demo}
      - PAYOUT_COOKIE_SECURE=true
      - PAYOUT_DOCS_DIR=/data/documents
    tmpfs:
      - /data:size=64m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: payout-caddy
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:?e.g. payout.203-0-113-10.sslip.io — set in deploy/.env}
      # Hostname of the demo copy (profile "demo"). Unset -> demo.localhost,
      # which Caddy serves with an internal certificate and nobody reaches.
      - DEMO_ADDRESS=${DEMO_ADDRESS:-demo.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                     # keeps the TLS certificates
      - caddy_config:/config
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    container_name: payout-backup
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./backup-loop.sh:/backup-loop.sh:ro
      - payout_docs:/documents:ro            # tarred nightly next to the dump
    entrypoint: ["sh", "/backup-loop.sh"]
    restart: unless-stopped

volumes:
  payout_pg:
    name: payout_pg
  payout_docs:
    name: payout_docs
  caddy_data:
  caddy_config:
