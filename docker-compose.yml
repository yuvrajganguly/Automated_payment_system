services:
  app:
    build: .
    container_name: payout
    ports:
      - "8000:8000"
    volumes:
      - payout_data:/data          # DB persists here, on Docker's own filesystem
    env_file:
      - .env                       # PAYOUT_JWT_SECRET lives here (git-ignored)
    environment:
      - PAYOUT_DB=/data/payout.db
      - PAYOUT_CORS_ORIGINS=*
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  payout_data:
    name: payout_data              # fixed name so importing the DB is easy
