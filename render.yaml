services:
  - type: web
    name: payout-system
    runtime: python
    buildCommand: |
      pip install -e ".[api]" &&
      cd frontend &&
      npm ci &&
      npm run build
    startCommand: uvicorn payout.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PAYOUT_JWT_SECRET
        generateValue: true
      # Public DEMO deployment: ephemeral SQLite in /tmp, re-seeded with demo
      # data on every deploy/restart. The real deployment runs Dockerized
      # PostgreSQL via docker-compose (see DOCKER.md).
      - key: PAYOUT_DB
        value: /tmp/payout.db
      - key: PAYOUT_COOKIE_SECURE
        value: "true"
      # Demo logins are opt-in; this is the one deployment that wants them.
      - key: PAYOUT_SEED_DEMO
        value: "1"
      - key: PYTHONPATH
        value: src
