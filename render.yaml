services:
  - type: web
    name: payout-system
    runtime: python
    buildCommand: |
      pip install -e ".[api]" &&
      cd frontend &&
      npm ci &&
      npm run build
    startCommand: uvicorn payout.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PAYOUT_JWT_SECRET
        generateValue: true
      - key: PAYOUT_DB
        value: /tmp/payout.db
      - key: PAYOUT_CORS_ORIGINS
        value: "*"
      - key: PYTHONPATH
        value: src
