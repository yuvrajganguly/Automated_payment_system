<svg xmlns="http://www.w3.org/2000/svg" width="680" height="510" viewBox="0 0 680 510" role="img" aria-labelledby="title desc">
  <title id="title">An electric delivery ride through Kolkata</title>
  <desc id="desc">A helmeted courier rides a vermilion electric scooter past shuttered shops and an arched heritage building in the afternoon sun.</desc>
