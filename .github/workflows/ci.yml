name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python · lint + format + types + tests (SQLite & PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payout
          POSTGRES_PASSWORD: payout
          # The suite DROPs the schema; conftest refuses any DB not named *_test.
          POSTGRES_DB: payout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payout -d payout_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (dev + api extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      # Gating. The historical backlog was baselined with `ruff --add-noqa`
      # (98 markers, burn them down as you touch files); new findings fail CI.
      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format (ruff format --check)
        run: ruff format --check src tests

      # Advisory until the 30 existing errors are fixed — then drop continue-on-error.
      - name: Type check (mypy)
        run: mypy src
        continue-on-error: true

      - name: Tests (SQLite, with coverage floor)
        run: pytest

      # Same suite against the production backend — catches dialect-translation
      # regressions the SQLite run can't see.
      - name: Tests (PostgreSQL)
        env:
          PAYOUT_DB_URL: postgresql://payout:payout@localhost:5432/payout_test
        run: pytest --no-cov

      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit --strict --progress-spinner off || echo "::warning::pip-audit found issues (advisory)"

  frontend:
    name: Frontend · typecheck + lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  docker:
    name: Docker · image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
