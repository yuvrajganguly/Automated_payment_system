name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python · lint + types + tests (SQLite & PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payout
          POSTGRES_PASSWORD: payout
          POSTGRES_DB: payout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payout -d payout"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (dev + api extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      # Advisory for now (581 findings to burn down) — does NOT gate the build.
      # TODO: fix findings, then remove continue-on-error so lint really gates.
      - name: Lint (ruff)
        run: ruff check src tests
        continue-on-error: true

      - name: Type check (mypy)
        run: mypy src
        continue-on-error: true

      - name: Tests (SQLite)
        run: pytest -q

      # Same suite against the production backend — catches dialect-translation
      # regressions the SQLite run can't see.
      - name: Tests (PostgreSQL)
        env:
          PAYOUT_DB_URL: postgresql://payout:payout@localhost:5432/payout
        run: pytest -q

  frontend:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Type check
        run: npx tsc -b   # -b applies --noEmit to composite tsconfig.node.json -> TS6310; app tsconfig already has noEmit

      - name: Production build
        run: npm run build
